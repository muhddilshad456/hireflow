services:
  # Redis service
  redis:
    image: redis:latest
    container_name: hireflow-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend service
  backend:
    image: hireflow-backend:latest
    container_name: hireflow-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy

  # Frontend service
  frontend:
    image: hireflow-frontend:latest
    container_name: hireflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
