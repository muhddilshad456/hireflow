
# HTTP server
server {
    listen 80;
    server_name hire-flow.space www.hire-flow.space;

    # Allow Let's Encrypt certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name hire-flow.space www.hire-flow.space;

    root /usr/share/nginx/html;
    index index.html;

    # SSL certificate
    ssl_certificate /etc/letsencrypt/live/hire-flow.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hire-flow.space/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # React frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API requests to backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forward Socket.IO requests to backend
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
